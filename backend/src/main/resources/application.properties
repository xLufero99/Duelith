# ===================== DUELITH - SUPABASE =====================
spring.application.name=duelith-backend
server.port=8080

# Importa variables del archivo .env (credenciales fuera del repositorio)
spring.config.import=optional:file:.env[.properties]

# ===================== SUPABASE POSTGRES (produccion / default) =====================
# Conexion directa (IPv6). Si tu red no soporta IPv6 usa el session pooler:
#   jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   usuario: postgres.vkxidckdpexnybznulff
spring.datasource.url=jdbc:postgresql://db.vkxidckdpexnybznulff.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ===================== JPA =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================== CREDENCIALES SUPABASE =====================
supabase.url=${SUPABASE_URL}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.jwks-url=${SUPABASE_JWKS_URL}

# ===================== JWT PROPIO (HS256, emitido por /api/auth/login) ==========
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# ===================== CORS =====================
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8443,http://127.0.0.1:8443,http://localhost:3000,http://localhost:4200

# ===================== SWAGGER =====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

# ===================== LOGGING =====================
logging.level.com.duelith=DEBUG
spring.web.error.include-message=always
