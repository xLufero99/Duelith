# ===================== DUELITH - SUPABASE (RAILWAY) =====================
spring.application.name=duelith-backend
server.port=8080

# Import de .env solo util en local. En Railway las variables se configuran
# en el dashboard. Descomenta para desarrollo fuera de Railway:
# spring.config.import=optional:file:.env[.properties]

# ===================== SUPABASE POSTGRES (Session Pooler US West 2) ==========
# La conexion directa db.<ref>.supabase.co es IPv6-only y no resuelve desde
# Railway. El pooler acepta IPv4. Puerto 5432 = session pooler.
spring.datasource.url=jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require&connectTimeout=30000&socketTimeout=30000
spring.datasource.username=postgres.vkxidckdpexnybznulff
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ===================== JPA =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================== CREDENCIALES SUPABASE (Auth/JWKS) =====================
supabase.url=${SUPABASE_URL}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.jwks-url=${SUPABASE_JWKS_URL}

# ===================== JWT PROPIO (HS256, emitido por /api/auth/login) ==========
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# ===================== CORS =====================
# Los patrones con * requieren CorsConfig.setAllowedOriginPatterns().
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8443,http://127.0.0.1:8443,http://localhost:3000,http://localhost:4200,https://*.railway.app,https://*.pages.dev

# ===================== SWAGGER =====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

# ===================== WOMPI (Pasarela de pagos) =====================
# Claves: la PUBLIC_KEY se expone al frontend; private/integrity/events SOLO backend.
wompi.api-url=${WOMPI_API_URL:https://sandbox.wompi.co/v1}
wompi.public-key=${WOMPI_PUBLIC_KEY:}
wompi.private-key=${WOMPI_PRIVATE_KEY:}
wompi.integrity-key=${WOMPI_INTEGRITY_KEY:}
wompi.events-secret=${WOMPI_EVENTS_SECRET:}
wompi.currency=${WOMPI_CURRENCY:COP}
# URLs a donde regresa el usuario tras pagar en el widget de Wompi.
wompi.success-url=${WOMPI_SUCCESS_URL:https://duelith.com/donaciones/exito}
wompi.failure-url=${WOMPI_FAILURE_URL:https://duelith.com/donaciones/fallo}
wompi.pending-url=${WOMPI_PENDING_URL:https://duelith.com/donaciones/pendiente}

# ===================== DONACIONES (limites y rate limiting) =====================
donaciones.min-amount=${MIN_DONATION_AMOUNT:1000}
donaciones.max-amount=${MAX_DONATION_AMOUNT:10000000}
donaciones.rate-limit-max-attempts=${RATE_LIMIT_MAX_ATTEMPTS:5}
donaciones.rate-limit-window-minutes=${RATE_LIMIT_WINDOW_MINUTES:60}

# ===================== LOGGING =====================
logging.level.com.duelith=DEBUG
spring.web.error.include-message=always
