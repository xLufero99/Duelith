# ===================== DUELITH - SUPABASE (RAILWAY) =====================
spring.application.name=duelith-backend
server.port=8080

# Import de .env solo util en local. En Railway las variables se configuran
# en el dashboard. Descomenta esta linea para desarrollo fuera de Railway:
# spring.config.import=optional:file:.env[.properties]

# ===================== SUPABASE POSTGRES (Session Pooler) =====================
# La conexion directa db.<ref>.supabase.co es IPv6-only y no resuelve desde
# Railway. El pooler aws-0-us-west-1.pooler.supabase.com si acepta IPv4.
# Puerto 5432 = session pooler | 6543 = transaction pooler.
spring.datasource.url=jdbc:postgresql://aws-0-us-west-1.pooler.supabase.com:6543/postgres?sslmode=require
spring.datasource.username=postgres.vkxidckdpexnybznulff
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ===================== JPA =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================== CREDENCIALES SUPABASE (Auth/JWKS) =====================
supabase.url=${SUPABASE_URL}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.jwks-url=${SUPABASE_JWKS_URL}

# ===================== JWT PROPIO (HS256, emitido por /api/auth/login) ==========
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# ===================== CORS =====================
# Los patrones con * requieren CorsConfig.setAllowedOriginPatterns().
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8443,http://127.0.0.1:8443,http://localhost:3000,http://localhost:4200,https://*.railway.app

# ===================== SWAGGER =====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

# ===================== LOGGING =====================
logging.level.com.duelith=DEBUG
spring.web.error.include-message=always
